<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-label="Alonso Hero">
  <defs>
    <linearGradient id="fuegoExt" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset=".35" stop-color="#f97316"/>
      <stop offset=".75" stop-color="#dc2626"/>
      <stop offset="1" stop-color="#7f1d1d" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fuegoInt" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fffbeb"/>
      <stop offset=".4" stop-color="#fde047"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pua" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f3f46"/>
      <stop offset=".5" stop-color="#18181b"/>
      <stop offset="1" stop-color="#000"/>
    </linearGradient>
    <linearGradient id="acero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f4f5"/>
      <stop offset=".45" stop-color="#71717a"/>
      <stop offset=".55" stop-color="#e4e4e7"/>
      <stop offset="1" stop-color="#3f3f46"/>
    </linearGradient>
    <linearGradient id="cromo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".3" stop-color="#d4d4d8"/>
      <stop offset=".5" stop-color="#52525b"/>
      <stop offset=".53" stop-color="#f4f4f5"/>
      <stop offset=".8" stop-color="#a1a1aa"/>
      <stop offset="1" stop-color="#27272a"/>
    </linearGradient>
    <linearGradient id="letraFuego" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef9c3"/>
      <stop offset=".35" stop-color="#facc15"/>
      <stop offset=".65" stop-color="#f97316"/>
      <stop offset="1" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="rayo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef9c3"/>
      <stop offset="1" stop-color="#eab308"/>
    </linearGradient>
    <filter id="brillo" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="b"/>
      <feFlood flood-color="#f97316"/>
      <feComposite in2="b" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sombra" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="2" flood-color="#000" flood-opacity=".9"/>
    </filter>
  </defs>

  <!-- Llamas -->
  <path d="M110 330 Q130 250 165 280 Q170 170 235 225 Q250 95 320 185 Q350 40 400 160 Q450 40 480 185 Q550 95 565 225 Q630 170 635 280 Q670 250 690 330 Z" fill="url(#fuegoExt)"/>
  <path d="M190 330 Q210 270 240 290 Q260 200 310 250 Q340 150 400 230 Q460 150 490 250 Q540 200 560 290 Q590 270 610 330 Z" fill="url(#fuegoInt)"/>

  <!-- Púa de guitarra de acero -->
  <path d="M400 18 C540 18 630 62 630 118 C630 205 482 318 400 362 C318 318 170 205 170 118 C170 62 260 18 400 18 Z" fill="url(#pua)" stroke="url(#acero)" stroke-width="10"/>
  <path d="M400 40 C522 40 606 76 606 120 C606 194 474 296 400 336 C326 296 194 194 194 120 C194 76 278 40 400 40 Z" fill="none" stroke="#dc2626" stroke-width="3" opacity=".8"/>
  <g fill="url(#acero)">
    <circle cx="232" cy="96" r="7"/><circle cx="568" cy="96" r="7"/><circle cx="400" cy="330" r="7"/>
  </g>

  <!-- Rayos -->
  <polygon points="118,40 58,190 108,190 76,320 178,140 126,140 160,40" fill="url(#rayo)" stroke="#713f12" stroke-width="4" filter="url(#brillo)"/>
  <polygon points="682,40 742,190 692,190 724,320 622,140 674,140 640,40" fill="url(#rayo)" stroke="#713f12" stroke-width="4" filter="url(#brillo)"/>

  <!-- Letras -->
  <g transform="translate(26 0) skewX(-8)" font-family="Impact, 'Arial Black', sans-serif" text-anchor="middle" filter="url(#sombra)">
    <text x="400" y="168" font-size="120" textLength="470" lengthAdjust="spacingAndGlyphs" fill="url(#cromo)" stroke="#18181b" stroke-width="5" paint-order="stroke">ALONSO</text>
    <g filter="url(#brillo)">
      <text x="400" y="292" font-size="150" textLength="420" lengthAdjust="spacingAndGlyphs" fill="url(#letraFuego)" stroke="#450a0a" stroke-width="6" paint-order="stroke">HERO</text>
    </g>
  </g>

  <!-- Destellos -->
  <g fill="#fff">
    <path d="M560 70 l5 14 l14 5 l-14 5 l-5 14 l-5 -14 l-14 -5 l14 -5 Z"/>
    <path d="M250 300 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4 Z" opacity=".8"/>
  </g>
</svg>
