name: Construir instalador

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  construir:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Calcular versión
        id: version
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0' }
          "valor=$v" >> $env:GITHUB_OUTPUT

      - name: Compilar instalador
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.version.outputs.valor }}" instalador\alonso-hero.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Guardar instalador
        uses: actions/upload-artifact@v4
        with:
          name: AlonsoHero-Instalador
          path: dist/*.exe

      - name: Publicar versión
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" (Get-ChildItem dist\*.exe).FullName --title "Alonso Hero $env:GITHUB_REF_NAME" --generate-notes
